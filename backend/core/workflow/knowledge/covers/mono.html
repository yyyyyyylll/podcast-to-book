<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Noto+Sans+SC:wght@300;400&display=swap');
body {
  --safe-top: 62px;
  --safe-right: 62px;
  --safe-bottom: 62px;
  --safe-left: 72px;
  margin: 0; padding: 0; width: 528px; height: 741px;
  background: #f5f3f0;
  font-family: 'Noto Serif SC', serif;
  position: relative; overflow: hidden;
}
.image-top {
  position: absolute; top: 0; left: 0; right: 0; height: 528px;
  overflow: hidden;
  background: #f2f2f2;
}
.cover-img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  filter: none;
}
.image-fallback {
  width: 100%; height: 100%;
  background: linear-gradient(180deg, #d8d8d8 0%, #f0f0f0 100%);
}
.content {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 222px; box-sizing: border-box;
  padding: 24px var(--safe-right) calc(var(--safe-bottom) + 6px) var(--safe-left);
  background: #f5f3f0;
  overflow: hidden;
}
.title {
  font-size: 32px; font-weight: 700; color: #1a1a1a;
  line-height: 1.3; letter-spacing: 3px;
  margin: 0; white-space: pre-line;
  overflow: hidden;
  max-height: 86px;
}
.subtitle {
  font-size: 14px; font-weight: 300; color: #666;
  letter-spacing: 4px; margin: 12px 0 0 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 100%;
}
.rule {
  width: 100%; height: 1px;
  background: #ddd;
  margin-top: 12px;
}
.author-row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  margin-top: 8px;
}
.author-line {
  font-size: 11px; color: #555; letter-spacing: 2px;
  line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%;
}
.series {
  font-family: 'Noto Serif SC', serif;
  font-size: 8px; color: #bbb; letter-spacing: 1.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%;
}
</style>
</head>
<body>
<div class="image-top">
  {% if cover_image %}
  <img class="cover-img" src="{{cover_image}}" />
  {% else %}
  <div class="image-fallback"></div>
  {% endif %}
</div>
<div class="content">
  <h1 class="title">{{title}}</h1>
  {% if subtitle %}<div class="subtitle">{{subtitle}}</div>{% endif %}
  <div class="rule"></div>
  <div class="author-row">
    <div>
      <div class="author-line">{{author_line_1}}</div>
      {% if author_line_2 %}<div class="author-line" style="margin-top:2px;">{{author_line_2}}</div>{% endif %}
    </div>
    <div class="series">{{series_label}}</div>
  </div>
</div>
<script>
document.fonts.ready.then(function(){
  var t = document.querySelector('.title');
  if (t) {
    var maxH = parseInt(getComputedStyle(t).maxHeight);
    t.style.maxHeight = 'none';
    var ls = parseFloat(getComputedStyle(t).letterSpacing) || 0;
    while (t.offsetHeight > maxH && ls > 0) {
      ls = Math.max(0, ls - 0.5);
      t.style.letterSpacing = ls + 'px';
    }
    var fs = parseFloat(getComputedStyle(t).fontSize);
    while (t.offsetHeight > maxH && fs > 18) {
      fs -= 1;
      t.style.fontSize = fs + 'px';
    }
    t.style.maxHeight = maxH + 'px';
  }
  document.querySelectorAll('.author-line, .series').forEach(function(el){
    var ls = parseFloat(getComputedStyle(el).letterSpacing) || 0;
    while(el.scrollWidth > el.clientWidth && ls > 0){
      ls = Math.max(0, ls - 0.5);
      el.style.letterSpacing = ls + 'px';
    }
    var fs = parseFloat(getComputedStyle(el).fontSize);
    while(el.scrollWidth > el.clientWidth && fs > 6){
      fs -= 0.5;
      el.style.fontSize = fs + 'px';
    }
  });

  document.querySelectorAll('body *').forEach(function(el){
    if(el.childElementCount > 0) return;
    var ls = parseFloat(getComputedStyle(el).letterSpacing);
    if(!(ls > 0)) return;
    var n = (el.textContent || '').trim().length;
    if(n > 1) el.style.letterSpacing = (ls * (n - 1) / n) + 'px';
    else el.style.letterSpacing = '0px';
  });

  var sub = document.querySelector('.subtitle');
  var rl = document.querySelector('.rule');
  var ar = document.querySelector('.author-row');
  if (t && !sub && rl && ar) {
    var curFs = parseFloat(getComputedStyle(t).fontSize);
    var slh = curFs * 1.3;
    if (t.scrollHeight <= slh * 1.2) {
      rl.style.marginTop = '36px';
      ar.style.marginTop = '18px';
    }
  }

  var ct = document.querySelector('.content');
  var tt = document.querySelector('.title');
  var imgTop = document.querySelector('.image-top');
  if (ct && tt) {
    tt.style.maxHeight = 'none';
    var fs2 = parseFloat(getComputedStyle(tt).fontSize);
    var isMulti = tt.offsetHeight > fs2 * 1.3 * 1.15;
    if (isMulti && ct.scrollHeight > ct.clientHeight) {
      var overflow = ct.scrollHeight - ct.clientHeight;
      var expand = Math.min(overflow + 8, 40);
      ct.style.height = (222 + expand) + 'px';
      if (imgTop) imgTop.style.height = (528 - expand) + 'px';
    }
    while (ct.scrollHeight > ct.clientHeight && fs2 > 20) {
      fs2 -= 1;
      tt.style.fontSize = fs2 + 'px';
    }
    tt.style.maxHeight = tt.offsetHeight + 'px';
  }
});
</script>
</body>
</html>
